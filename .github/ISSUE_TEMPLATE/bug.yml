name: Bug report
description: Report an incorrect implementation or repository automation problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Fibonacci implementation
        - CI / automation
        - Documentation
        - Repository structure
        - Other
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      description: If this affects a language implementation, name it here.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what is wrong and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide commands, input, output, or other steps needed to reproduce the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked for an existing issue covering this problem.
          required: true
