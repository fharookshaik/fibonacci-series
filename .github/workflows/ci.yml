name: Repository CI

on:
  push:
    branches:
      - main
      - chore/repository-reboot
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate repository structure
        run: python utils/validate_repository.py

      - name: Test canonical implementations
        run: python utils/test_implementations.py --write-status

      - name: Verify generated implementation status is current
        run: git diff --exit-code tests/STATUS.md
